  - generic [ref=f5e56]:
    - heading "Für wen wir arbeiten" [level=2] [ref=f5e57]
    - paragraph [ref=f5e58]: Wir betreuen bereits Objekte im Havelland in festen Pflegeverträgen. Sobald mehrere Gewerke an einem Objekt zusammenkommen, braucht es jemanden, der den Überblick behält. Noah Telo nimmt Ihre Objekte auf, plant Begehung und Termine und schickt Ihnen den Nachweis nach jedem Einsatz. Wer welche Leistung ausführt, steht bei jeder Leistung dabei.
    - list [ref=f5e59]:
      - listitem [ref=f5e60]:
        - strong [ref=f5e61]: Wohnungseigentümergemeinschaft (WEG)
        - text: — Ein Saisonvertrag statt Einzelaufträge, Nachweis für alle Eigentümer.
      - listitem [ref=f5e62]:
        - strong [ref=f5e63]: Mehrfamilienhaus und Vermieter
        - text: — Gehwege, Grünflächen und Müllplatz im festen Turnus, dazu die Wohnung leer nach Auszug.
      - listitem [ref=f5e64]:
        - strong [ref=f5e65]: Hausverwaltung mit mehreren Objekten
        - text: — Eine Begehung je Objekt, Angebote und Nachweise objektweise sortiert.
      - listitem [ref=f5e66]:
        - strong [ref=f5e67]: Gewerbehof und Autohaus
        - text: — Zufahrt, Ladezone und Ausstellungsfläche vor der Öffnung frei und gepflegt.
      - listitem [ref=f5e68]:
        - strong [ref=f5e69]: Einzelhandel und Kundenparkplatz
        - text: — Stellflächen, Wege und Eingang begehbar, bevor die ersten Kunden kommen.
      - listitem [ref=f5e70]:
        - strong [ref=f5e71]: Praxis und Büro
        - text: — Eingang, Treppenhaus und Außenanlage im vereinbarten Rhythmus gepflegt.
