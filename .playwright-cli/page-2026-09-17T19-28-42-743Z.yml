    - generic [ref=f5e83]:
      - link "01 Grünpflege und Laub Eigene Ausführung Rasen, Hecken, Beete und Gehölze pflegen wir im festen Turnus, dazu im Herbst mehrere Laubeinsätze auf Wegen, Stellflächen und Grünstreifen. Grünschnitt und Laub laden wir auf und fahren sie ab. Nach jedem Einsatz bekommen Sie Fotos, damit Eigentümer und Verwaltung den Zustand jederzeit nachvollziehen können. Mehr zur Gartenpflege →" [ref=f5e84] [cursor=pointer]:
