  - generic [ref=f4e59]:
    - paragraph [ref=f4e60]:
      - strong [ref=f4e61]: "Eine Haushaltsauflösung ist die vollständige Räumung einer Wohnung oder eines Hauses nach einem Erbfall, dem Umzug ins Pflegeheim oder einem Wegzug. Wir sichten den Nachlass, trennen Verwertbares und Wertgegenstände vom Rest, entsorgen fachgerecht und übergeben am Ende besenrein an Vermieter oder Käufer. Der Unterschied zur Entrümpelung: Dort räumen Sie selbst weiter in Ihrem Zuhause, hier geben Angehörige eine Wohnung ab, in der niemand mehr wohnen wird."
    - heading "Haushaltsauflösung im Havelland — in vier Schritten" [level=2] [ref=f4e62]
    - 'heading "Schritt 1 — Sichten: Dokumente, Erinnerungen, Wertgegenstände" [level=3] [ref=f4e63]'
    - paragraph [ref=f4e64]: Bevor der erste Karton gepackt wird, sichten wir gemeinsam mit Ihnen die Wohnung. Sie entscheiden, was bleibt, was zu Ihnen nach Hause kommt und was weg darf. Dokumente wie Verträge, Sparbücher, Versicherungsunterlagen und Ausweise legen wir beiseite, genauso Fotoalben, Briefe und Schmuck. Diese Dinge tragen oft mehr Bedeutung als Marktwert, und wir behandeln sie entsprechend. Nichts verlässt die Wohnung ohne Ihre Freigabe. Bei einer Erbengemeinschaft sprechen wir das Vorgehen mit allen Beteiligten ab, bevor wir anfangen. Sie müssen dafür nicht selbst jeden Schrank öffnen. Wir fotografieren auffällige Fundstücke und schicken Ihnen die Bilder per WhatsApp; Sie entscheiden dann, ob es bleibt, zu Ihnen kommt oder in die Verwertung geht. Diese erste Sichtung gehört zum Besichtigungstermin und ist im Festpreis für Räumung und Abtransport enthalten.
    - 'heading "Schritt 2 — Fristen: Kündigung, Übergabe, Nachlass" [level=3] [ref=f4e65]'
    - paragraph [ref=f4e66]: "Bei einer Mietwohnung gibt die Kündigungsfrist laut Mietvertrag den Rahmen vor, danach richten wir den Räumungstermin aus. Den Übergabetermin vereinbaren wir mit Ihnen und, wenn gewünscht, direkt mit der Hausverwaltung oder dem Vermieter, inklusive Übergabeprotokoll. Bei einem Erbfall kommen oft Fragen zum Erbschein oder zur Erbengemeinschaft dazu. Diese Punkte klären Sie mit dem Nachlassgericht oder einer Rechtsberatung, eine Rechtsauskunft können wir dazu nicht geben. Steht die Erbengemeinschaft noch nicht vollständig, warten wir mit dem Räumungstermin, bis alle Beteiligten zugestimmt haben. Sobald der Termin feststeht, arbeiten wir darauf hin: Besichtigung, schriftlicher Festpreis, Räumung, Übergabe. So kommen Sie durch eine Frist, die sich nicht verschieben lässt, ohne dass wir Ihnen dabei Fragen beantworten, die eigentlich ein Anwalt oder das Nachlassgericht klären muss."
    - heading "Schritt 3 — Verwerten, spenden, entsorgen" [level=3] [ref=f4e67]
    - paragraph [ref=f4e68]: "Bei der Besichtigung prüfen wir, was noch einen Wert hat: Möbel, Elektrogeräte, Werkzeug, Geschirr. Verwertbares zieht Noah Telo zuerst heraus, oft schon während der Besichtigung, und rechnet es auf den Festpreis an. Was Sie selbst verschenken oder spenden wollen, kommt vorher weg; auf Wunsch fahren wir gut erhaltene Stücke direkt zu einem Sozialkaufhaus. Größere Mengen aus Haushaltsauflösungen nimmt die Sperrmüllabfuhr des Landkreises nicht mit — deshalb fahren wir bei uns immer selbst zum Wertstoffhof Falkensee, auch wenn private Haushalte sonst zweimal im Jahr kostenlos abholen lassen können (nach Anmeldung, bis zu vier Wochen Wartezeit). Am Wertstoffhof laden wir sortiert nach Holz, Metall, Elektroschrott und Restabfall ab, die Gebühren weisen wir nach Beleg aus, zuzüglich Mehrwertsteuer, ohne eigenen Aufschlag. So bleibt am Ende nur der Teil übrig, für den wirklich niemand mehr Verwendung hat."
    - heading "Schritt 4 — Besenrein übergeben, mit Foto-Nachweis" [level=3] [ref=f4e69]
    - paragraph [ref=f4e70]: Am Übergabetag ist die Wohnung leer, gefegt und frei von Kleberesten und Haken, bereit für Vermieter, Käufer oder den nächsten Mieter. Den Zustand halten wir mit Fotos fest und schicken sie Ihnen direkt aufs Handy, auch wenn Sie selbst nicht vor Ort sind. Damit haben Sie einen Nachweis für die Übergabe und für die Hausverwaltung. Wollen Sie zusätzlich Böden, Bäder und Küche grundreinigen lassen, bieten wir das als eigene Position mit eigenem Preis an, nie als automatischen Aufschlag. So wissen Sie vorher, was die Grundreinigung zusätzlich kostet, statt es im Festpreis versteckt zu finden. Nach der Übergabe bekommen Sie zusätzlich alle Entsorgungsbelege und die Rechnung mit ausgewiesener Mehrwertsteuer, damit Sie gegenüber Vermieter, Erbengemeinschaft oder Nachlassgericht alles belegen können. Für die Abnahme reicht danach meist ein kurzer gemeinsamer Rundgang durch die leeren Räume.
    - heading "Haushaltsauflösung in Ihrer Nähe" [level=3] [ref=f4e71]
    - paragraph [ref=f4e72]: "Wir sitzen in Falkensee und sind im ganzen Havelland unterwegs: Dallgow-Döberitz, Brieselang, Schönwalde-Glien, Wustermark, Nauen und Berlin-Spandau liegen auf dem Weg. Gerade bei einer Haushaltsauflösung im Erb- oder Pflegefall kommen wir diskret vorbei, ohne dass es in der Nachbarschaft auffällt. Kurze Anfahrtswege bedeuten kurze Reaktionszeiten: Ihre WhatsApp-Nachricht beantworten wir innerhalb von Stunden, nicht erst nach Tagen."
    - heading "So läuft es ab" [level=3] [ref=f4e73]
    - paragraph [ref=f4e74]: "So läuft Ihre Haushaltsauflösung ab. Erstens: Anruf oder WhatsApp, meist reicht das, um Lage und Zeitdruck zu klären. Zweitens: Besichtigung vor Ort, mit Ihnen, einem Angehörigen oder dem Schlüsselhalter, Noah Telo kommt persönlich. Drittens: schriftlicher Festpreis für Räumung und Abtransport, Entsorgungsgebühren weisen wir nach Beleg aus. Viertens: der Räumungstermin, auch wenn Sie selbst nicht in Falkensee oder im Havelland sind, Schlüsselübergabe und eine kurze schriftliche Vollmacht reichen aus. Fünftens: Foto-Nachweis und Übergabe an Vermieter, Käufer oder die Erbengemeinschaft."
    - heading "Unsere Garantie" [level=3] [ref=f4e75]
    - paragraph [ref=f4e76]: Ihre Wohnung ist zur vereinbarten Zeit leer und besenrein. Schaffen wir das nicht, räumen wir am nächsten Werktag ohne Aufpreis nach. Entsorgungsgebühren weisen wir nach Beleg aus.
