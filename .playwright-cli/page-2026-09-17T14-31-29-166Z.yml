  - generic [ref=f4e91]:
    - 'heading "Haushaltsauflösung im Erbfall: Was Angehörige wissen sollten" [level=2] [ref=f4e92]'
    - paragraph [ref=f4e93]:
      - strong [ref=f4e94]: Erst sichten, dann räumen — und nichts geht ohne Ihre Freigabe.
    - paragraph [ref=f4e95]: "Sind mehrere Erben beteiligt, sprechen wir den Ablauf mit allen ab, bevor der Räumungstermin steht. Sind sich noch nicht alle einig, was mit einzelnen Stücken passieren soll, warten wir, bis eine Entscheidung getroffen ist. Rechtliche Fragen zum Erbschein oder zur Erbengemeinschaft können wir Ihnen nicht beantworten, dafür ist das Nachlassgericht oder eine Rechtsberatung zuständig. Was wir übernehmen: Wir dokumentieren mit Fotos, was aus der Wohnung geht, damit alle Erben nachvollziehen können, was passiert ist, auch wenn sie nicht selbst vor Ort waren. Drückt die Kündigungsfrist beim Vermieter, richten wir Besichtigung und Räumungstermin danach aus und halten das Tempo, das die Frist vorgibt. So bleibt der Ablauf für alle Beteiligten nachvollziehbar, auch über größere Entfernungen und mehrere Haushalte hinweg."
  - generic [ref=f4e98]:
    - 'heading "Umzug ins Pflegeheim: Wohnung auflösen, ohne alles wegzuwerfen" [level=2] [ref=f4e99]'
    - paragraph [ref=f4e100]: "Zieht ein Angehöriger ins Pflegeheim, beginnt die Auflösung meist mit einem Teilumzug. Wir packen zuerst zusammen mit Ihnen, was mit ins Heim soll: einzelne Möbelstücke, Kleidung, persönliche Gegenstände, oft auch ein Lieblingssessel oder Fotos für das neue Zimmer. Diese Stücke liefern wir auf Wunsch direkt an, bevor wir mit der restlichen Wohnung weitermachen. Danach lösen wir den übrigen Haushalt auf: Möbel, Hausrat und alles, was nicht mit umzieht. Termine stimmen wir mit Ihnen und, wenn nötig, mit dem Pflegeheim oder der Betreuung ab, damit Umzugstermin und Räumungstermin zusammenpassen. Wir arbeiten diskret, ohne dass in der Nachbarschaft auffällt, was gerade passiert, und Sie müssen nicht bei jedem Schritt dabei sein."
  - generic [ref=f4e103]:
    - heading "Sie wohnen nicht im Havelland? Auflösung ohne Ihre Anwesenheit" [level=2] [ref=f4e104]
    - paragraph [ref=f4e105]: "Viele Erben und Angehörige wohnen nicht im Havelland und können nicht für jeden Termin anreisen. Das ist bei uns kein Hindernis: Den Schlüssel übergeben Sie uns direkt, über die Hausverwaltung oder über eine Vertrauensperson vor Ort. Für die Übergabe an Vermieter oder Käufer reicht eine kurze schriftliche Vollmacht, in der steht, wer für Sie unterschreiben darf. Jede Etappe halten wir mit Fotos fest, von der Besichtigung bis zur leeren, besenreinen Wohnung, und schicken sie Ihnen aufs Handy. Rechnung und alle Entsorgungsbelege bekommen Sie zusätzlich per Mail, damit Sie ohne Anfahrt einen vollständigen Nachweis haben. So begleiten Sie die Haushaltsauflösung von überall aus, ohne dafür einen Tag freinehmen zu müssen."
  - generic [ref=f4e108]:
    - heading "Wohnungsauflösung im Havelland" [level=2] [ref=f4e109]
    - paragraph [ref=f4e110]: "Wohnungsauflösung und Haushaltsauflösung meinen im Alltag dasselbe: das vollständige Räumen einer Wohnung samt Möbeln und Hausrat, mit Übergabe an den Vermieter am Ende. Der Begriff Wohnungsauflösung wird meist bei Mietwohnungen verwendet, etwa nach einem Auszug, einem Erbfall oder dem Umzug ins Pflegeheim, wenn die Kündigungsfrist läuft. Wir übernehmen die Wohnungsauflösung in Falkensee und im Havelland: sichten, sichern, räumen, entsorgen und besenrein an den Vermieter übergeben, inklusive Übergabeprotokoll auf Wunsch. Den Festpreis nennen wir nach der kostenlosen Besichtigung."
  - generic [ref=f4e113]:
    - heading "Unterschied Haushaltsauflösung und Entrümpelung" [level=2] [ref=f4e114]
    - paragraph [ref=f4e115]:
      - text: "Ein Beispiel macht den Unterschied greifbar. Ihr Vater lebt noch im Haus, nur der Keller soll leer werden, damit wieder Platz ist: Das ist eine Entrümpelung, er bleibt wohnen. Die Wohnung Ihrer verstorbenen Mutter wird dagegen gekündigt, nichts soll bleiben, am Ende steht die Übergabe an den Vermieter: Das ist eine Haushaltsauflösung. Für Räumung und Abtransport gilt bei beidem derselbe Festpreis-Rahmen, nur der Umfang unterscheidet sich."
      - link "Zur Entrümpelung rund ums Haus" [ref=f4e116] [cursor=pointer]:
        - /url: /entruempelung/
      - text: .
