        - term [ref=f9e88]: Wertstoffhof
        - definition [ref=f9e89]: Wertstoffhof Falkensee, Nauener Straße 97, im Gewerbegebiet Nord. Montag 9–18 Uhr, Dienstag bis Freitag 9–17 Uhr, Samstag 8–13 Uhr. Der Betreiber wiegt jede Ladung und rechnet nach der Abfallgebührensatzung 2026 des Landkreises ab; Schrott ohne Gebühr, gemischter Siedlungsabfall 0,32 € je Kilogramm, Altholz 0,36 €.
      - generic [ref=f9e90]:
        - term [ref=f9e91]: Sperrmüll
        - definition [ref=f9e92]: Die kommunale Abfuhr holt bei Privathaushalten zweimal jährlich kostenlos ab, nach Anmeldung bei der HAW mbH und mit bis zu vier Wochen Wartezeit. Größere Mengen aus Haushaltsauflösungen schließt sie ausdrücklich aus, ebenso Bauabfälle, Fenster, Türen und Laminat. Bei einer Auflösung fahren wir deshalb alles selbst zum Wertstoffhof.
      - generic [ref=f9e93]:
        - term [ref=f9e94]: Übergabe
        - definition [ref=f9e95]: Den Termin mit Vermieter, Hausverwaltung oder Käufer stimmen wir ab und nehmen ihn auf Wunsch mit Ihrer Vollmacht wahr; Ihr Ansprechpartner ist Noah Telo vom Haus- & Gartenservice Havelland. Übergabeprotokoll und Fotos der leeren Räume bekommen Sie per Mail.
      - generic [ref=f9e96]:
        - term [ref=f9e97]: Ortsteile
        - definition [ref=f9e98]: "Wir lösen Haushalte in allen sieben Wohngebieten auf: Falkenhagen, Seegefeld, Finkenkrug, Alter Finkenkrug, Falkenhain, Falkenhöh und Waldheim. Falkensee hat 46.906 Einwohner (Stand November 2025), PLZ 14612."
