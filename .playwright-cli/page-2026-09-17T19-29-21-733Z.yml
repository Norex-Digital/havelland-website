  - generic [ref=f9e62]:
    - heading "Haushaltsauflösung in Falkensee — zuverlässig & lokal" [level=2] [ref=f9e63]
    - paragraph [ref=f9e64]: In Falkensee, der größten Stadt im Havelland an der Grenze zu Berlin-Spandau, stehen viele Häuser seit den Siedlungsjahren in Familienhand. Wechselt ein Elternhaus in den Wohnvierteln Richtung Finkenkrug den Besitzer, steht oft die komplette Auflösung des Haushalts an. Wir lösen Wohnung oder Haus vollständig auf, entsorgen fachgerecht und übergeben besenrein — diskret, gerade im Erb- oder Pflegefall. Die kurzen Wege aus dem Havelland machen einen Termin schnell möglich. Ein Haushalt, ein Ansprechpartner.
    - paragraph [ref=f9e65]: "Eine Haushaltsauflösung in Falkensee betrifft den ganzen Hausstand: Möbel, Küche, Kleidung, Hausrat und die vielen Kleinigkeiten über Jahrzehnte. Sie sichten in Ruhe, was bleiben soll; Fotos, Unterlagen und Erinnerungsstücke legen wir beiseite, statt sie zu entsorgen. Den Rest lösen wir vollständig auf, trennen Wertstoffe und führen alles der richtigen Entsorgung zu. Gut erhaltene Möbel und Antiquitäten rechnen wir offen an. Ob Eigenheim, geerbtes Elternhaus oder die Wohnungsauflösung einer Mietwohnung: Am Ende ist der Haushalt aufgelöst und die Räume sind besenrein."
    - heading "Festpreis & Foto-Nachweis" [level=3] [ref=f9e66]
    - paragraph [ref=f9e67]: Nach der kostenlosen Besichtigung in Falkensee steht ein Festpreis für Räumung und Abtransport der gesamten Auflösung; Entsorgungsgebühren weisen wir nach Beleg aus. Wir halten die vereinbarte Zeit ein — wichtig, wenn ein Übergabetermin beim Notar oder Vermieter drängt — und dokumentieren das Ergebnis auf Wunsch per Foto.
    - paragraph [ref=f9e68]:
      - text: "Mehr zum Thema lesen Sie in unserem Ratgeber:"
      - 'link "Haushaltsauflösung Kosten: Was den Preis bestimmt" [ref=f9e69] [cursor=pointer]':
        - /url: /ratgeber/haushaltsaufloesung-kosten/
      - text: .
  - generic [ref=f9e72]:
    - heading "Haushaltsauflösung in Falkensee — Schritt für Schritt, auch aus der Ferne" [level=2] [ref=f9e73]
    - heading "Sichten und sichern in Falkensee" [level=3] [ref=f9e74]
    - paragraph [ref=f9e75]: "Bevor in Falkensee ein Karton den Haushalt verlässt, gehen wir mit Ihnen durch die Wohnung, ob Elternhaus in Falkenhagen oder Mietwohnung in Seegefeld. Sie zeigen, was zu Ihnen kommt, was an Geschwister oder Enkel geht und was weg darf. Wir suchen dabei gezielt nach dem, was in Schubladen und Schrankfächern liegt: Sparbücher, Versicherungsordner, Ausweise, Schmuck, Münzen, Fotoalben und Briefe. Alles davon kommt in eine Kiste, die Sie mitnehmen oder die bis zur Übergabe verschlossen in der Wohnung bleibt. Können Sie nicht kommen, fotografiert Noah Telo jedes auffällige Fundstück und schickt Ihnen das Bild per WhatsApp; Sie entscheiden, wir handeln danach. Nichts geht in die Verwertung oder auf den Anhänger, bevor Sie es freigegeben haben. Bei einer Erbengemeinschaft holen wir die Zustimmung aller Beteiligten ein, bevor wir den Räumungstermin festlegen."
    - heading "Fristen und Übergabe an Falkenseer Vermieter und Hausverwaltungen" [level=3] [ref=f9e76]
    - paragraph [ref=f9e77]: "Bei einer Mietwohnung in Falkensee setzt der Mietvertrag die Frist: Die Kündigungsfrist läuft, und am letzten Tag will der Vermieter oder die Hausverwaltung die Wohnung leer und besenrein sehen, mit Übergabeprotokoll. Wir planen von diesem Datum rückwärts: Besichtigung, schriftlicher Festpreis, Räumungstage, ein Puffer für die Nachkontrolle. Den Übergabetermin stimmen wir auf Wunsch direkt mit der Verwaltung ab und nehmen ihn mit Ihrer Vollmacht wahr, wenn Sie nicht anreisen können. Was die Frist rechtlich bedeutet, ob im Erbfall eine Sonderkündigung greift oder wie eine Erbengemeinschaft entscheidet, klären Sie mit dem Nachlassgericht oder einem Anwalt; dazu geben wir keine Auskunft. Bei einem Haus, das verkauft wird, ist der Notartermin der Fixpunkt, und wir übergeben davor an Sie oder den Käufer."
    - heading "Verwerten und entsorgen — der Wertstoffhof liegt direkt vor Ort" [level=3] [ref=f9e78]
    - paragraph [ref=f9e79]: "Ein kompletter Haushalt in Falkensee bedeutet mehrere Fahrten mit dem Anhänger. Der Wertstoffhof an der Nauener Straße 97 liegt im Stadtgebiet, von jedem Wohngebiet aus wenige Minuten. Jede Fahrt kostet uns damit kaum Zeit, und das rechnet sich für Sie im Festpreis. Die Sperrmüllabfuhr des Landkreises ist bei einer Auflösung keine Alternative: Sie lässt größere Mengen aus Haushaltsauflösungen ausdrücklich stehen und braucht bis zu vier Wochen Vorlauf. Bevor etwas auf den Anhänger kommt, ziehen wir heraus, was noch einen Wert hat: die Schrankwand in gutem Zustand, die Waschmaschine, das Werkzeug aus dem Keller. Das rechnen wir auf den Festpreis an oder fahren es, wenn Sie das wollen, zu einer Spendenstelle. Am Wertstoffhof laden wir nach Fraktionen ab; auf dem Beleg stehen Gewicht und Satz je Abfallart, zum Beispiel gemischter Siedlungsabfall 0,32 € und Altholz 0,36 € je Kilogramm (2026). Diese Belege geben wir ohne Aufschlag weiter, zuzüglich Mehrwertsteuer."
    - heading "Übergabe besenrein, mit Foto-Nachweis" [level=3] [ref=f9e80]
    - paragraph [ref=f9e81]: Am Übergabetag sind die Räume leer, die Böden gefegt, Haken und Klebereste entfernt, und das gilt auch für Kellerabteil und Bodenkammer, denn die Hausverwaltung prüft sie bei der Abnahme mit. Wir fotografieren jeden Raum und schicken Ihnen die Bilder direkt aufs Handy, dazu die Rechnung und alle Wertstoffhof-Belege per Mail. Damit haben Sie gegenüber Vermieter, Käufer, Miterben oder dem Nachlassgericht einen Nachweis, ohne selbst in Falkensee gewesen zu sein. Wollen Sie mehr als besenrein, also Bad, Küche und Böden grundgereinigt, bieten wir das als eigene Position mit eigenem Preis an. Das steht vorher im Angebot, nie als stiller Aufschlag auf den Festpreis. Malerarbeiten, Bodenbeläge und die Sanierung von Schimmel in der Bausubstanz übernehmen wir nicht; dafür vermitteln wir einen Fachbetrieb und stimmen den Termin mit ab.
