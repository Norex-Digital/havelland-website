  - generic [ref=f9e102]:
    - heading "Sie wohnen nicht in Falkensee? Auflösung ohne Ihre Anwesenheit" [level=2] [ref=f9e103]
    - paragraph [ref=f9e104]: "Wer ein Elternhaus in Falkensee auflöst, wohnt nicht unbedingt in der Nähe. Der Ablauf ohne Anreise sieht so aus: Den Schlüssel bekommen wir von einer Vertrauensperson vor Ort oder von der Hausverwaltung. Sie schicken uns eine kurze schriftliche Vollmacht, in der steht, was weg darf, was zu Ihnen soll und wer bei der Übergabe unterschreibt. Fundstücke aus Schränken und Schubladen fotografieren wir und fragen per WhatsApp nach, bevor sie in eine Kiste oder auf den Anhänger gehen. Nach jeder Etappe kommen Fotos: die gesichtete Wohnung, die halb geräumte, die leere und gefegte. Rechnung und alle Entsorgungsbelege schicken wir per Mail. So lief zuletzt eine Räumung in Falkensee, Abstellkammer und Gartenschuppen: Die Kundin wohnte in einem anderen Bundesland, den Schlüssel gab uns eine Vertrauensperson, und die Fotos vom Ergebnis gingen am selben Abend aufs Handy. Bei einer Erbengemeinschaft mit mehreren Wohnorten schicken wir die Bilder an alle, die sie sehen sollen."
  - generic [ref=f9e107]:
    - 'heading "Erbfall in Falkensee: erst sichten, dann räumen" [level=2] [ref=f9e108]'
    - paragraph [ref=f9e109]:
      - text: "Nach einem Todesfall in Falkensee stehen Angehörige vor einem Haus voller Dinge und einer Frist, die nicht wartet. Der erste Termin ist deshalb ein Rundgang ohne Anhänger: Was hat Bedeutung, was hat Wert, was kann weg. Erst wenn Sie das entschieden haben, planen wir die Räumungstage. Sind mehrere Erben beteiligt, holen wir vor dem Termin die Zustimmung aller ein und dokumentieren mit Fotos, was die Wohnung verlässt, damit später niemand raten muss. Fragen zum Erbschein, zur Ausschlagung oder zur Haftung für Mietschulden beantwortet das Nachlassgericht oder ein Anwalt, nicht wir. Was wir zusagen: ein schriftlicher Festpreis für Räumung und Abtransport nach der kostenlosen Besichtigung, Entsorgung nach Beleg zuzüglich Mehrwertsteuer, und eine besenreine Übergabe zum vereinbarten Datum. Den ganzen Ablauf in vier Schritten, vom Sichten bis zur Übergabe, beschreibt unsere Hauptseite."
      - link "Der ganze Ablauf auf der Hauptseite" [ref=f9e110] [cursor=pointer]:
        - /url: /haushaltsaufloesung/
      - text: .
