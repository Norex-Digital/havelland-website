        - heading "Flächenräumung 1.300 m², Falkensee" [level=3] [ref=f14e134]
        - paragraph [ref=f14e135]: September 2026 · 3 Tage · ca. 1.300 m²
        - paragraph [ref=f14e136]: "Ein Grundstück in Falkensee, rund 1.300 Quadratmeter Wiese und Wildkraut. Der Auftrag: die oberflächige Entfernung des gesamten Bewuchses, keine Gehölze, keine Baumfällung. Wir haben an drei Tagen vom 7. bis 9. September 2026 gearbeitet, den Aufwuchs abgefahren und entsorgt; beides steckte im Festpreis. Übergeben haben wir eine offene, freigeräumte Fläche, auf der der Eigentümer jetzt planen kann. Als Folgeauftrag ist der Rückbau des alten Zauns samt Betonfundamenten besprochen; dort rechnen wir die Entsorgung nach Beleg ab, zuzüglich Mehrwertsteuer. Die Vorher-Nachher-Fotos zeigen wir mit Einwilligung des Kunden."
