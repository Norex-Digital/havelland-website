  - generic [ref=f14e103]:
    - heading "Rodung, Zaun, Pflege — die richtige Reihenfolge" [level=2] [ref=f14e104]
    - paragraph [ref=f14e105]:
      - strong [ref=f14e106]: "Erst weg, dann neu, dann gepflegt: ein Ansprechpartner, ein Termin."
    - paragraph [ref=f14e107]:
      - text: "Die Reihenfolge entscheidet über den Preis. Wer den Zaun setzt, bevor die alte Hecke samt Wurzeln raus ist, zahlt später doppelt: Die Stubbenfräse kommt nicht mehr an die Wurzelreihe heran, und der neue Zaun steht auf Wurzelwerk, das sich beim Verrotten setzt. Deshalb arbeiten wir in fester Abfolge. Erst die Rodung im Winterfenster, dann das Fräsen der Stubben und Wurzeln, bis die Fläche eben ist. Danach kommen Kanten, Pflaster oder der Zaun auf tragfähigen Grund, zuletzt Rasen und Beete. Alles in einem Auftrag geplant heißt: eine Besichtigung, ein schriftlicher Festpreis für alle Positionen, weniger Anfahrten und kein Leerlauf zwischen Gewerken, die aufeinander warten. Wer die fertige Fläche danach in die regelmäßige Gartenpflege im 14-tägigen Rhythmus gibt, behält dieselbe Nummer und dasselbe Team, das schon gerodet und montiert hat."
      - link "Zur regelmäßigen Gartenpflege" [ref=f14e108] [cursor=pointer]:
        - /url: /gartenpflege/
      - text: .
  - generic [ref=f14e111]:
    - heading "Wann welche Arbeit sinnvoll ist" [level=2] [ref=f14e112]
    - paragraph [ref=f14e113]: "Hecken und Gehölze roden wir vom 1. Oktober bis 28. Februar; von März bis September ist das Beseitigen nach § 39 BNatSchG untersagt. Der Formschnitt an einer Hecke, die bleiben soll, ist davon nicht betroffen und läuft ganzjährig. Stubben fräsen geht das ganze Jahr, weil bereits gefällte Stümpfe nicht unter das Fenster fallen. Zaunbau läuft auch im Winter: Pfosten in Einschlaghülsen brauchen kein Aushärten und sind frostunabhängig, nur einbetonierte Eck-, End- und Torpfosten wollen frostfreie Tage. Pflaster, Kantensteine und Beeteinfassungen legen wir auf frostfreie Zeiten, weil sich gefrorener Unterbau nicht sauber verdichten lässt. Für ein Kombiprojekt heißt das: Anfrage im Herbst, Rodung und Stubben zwischen Oktober und Februar, Zaun direkt im Anschluss, Kanten und Beete ab dem Frühjahr. Wer erst im Februar anfragt, konkurriert mit allen, die ihre Rodung noch vor dem Fristende erledigt haben wollen."
  - generic [ref=f14e116]:
    - 'heading "Zaun, Hecke, Rodung: was Sie vorher klären sollten" [level=2] [ref=f14e117]'
    - paragraph [ref=f14e118]:
      - text: "Drei Dinge lohnen sich vor der Anfrage. Erstens der Zaun: Ob er eine Genehmigung braucht, hängt von Höhe, Lage des Grundstücks und der örtlichen Satzung ab; in Falkensee gelten im Ortskern Falkenhagen eigene Gestaltungsregeln. Was für Ihr Grundstück gilt und wer den Grenzzaun zahlt, erklärt unser Ratgeber zur Zaungenehmigung in Brandenburg; eine Rechtsberatung ersetzt er nicht. Zweitens die Hecke: Auf dem eigenen Grundstück ist die Entfernung im Fenster vom 1. Oktober bis 28. Februar der Regelfall, Ausnahmen gibt es bei geschützten Landschaftsbestandteilen und kommunalen Satzungen. Drittens der Nachbar: Steht die Hecke oder der Zaun auf der Grenze, sprechen Sie vorher mit der anderen Seite; das erspart Streit, den kein Handwerker auflöst. Was uns bei der Besichtigung auffällt, sagen wir Ihnen. Die Entscheidung und die Anfragen bei Gemeinde oder Naturschutzbehörde bleiben bei Ihnen."
      - link "Ratgeber Zaun-Genehmigung Brandenburg" [ref=f14e119] [cursor=pointer]:
        - /url: /ratgeber/zaun-genehmigung-brandenburg/
      - text: ·
      - 'link "Ratgeber Hecke entfernen: was erlaubt ist" [ref=f14e120] [cursor=pointer]':
        - /url: /ratgeber/hecke-entfernen-erlaubt/
      - text: .
  - generic [ref=f14e123]:
    - 'heading "Ehrlich: kleinere Arbeiten, kein Großprojekt" [level=2] [ref=f14e124]'
    - paragraph [ref=f14e125]: "Ein GaLaBau-Großbetrieb plant Ihren Garten neu, fährt mit Bagger und Radlader auf und rechnet in Wochen. Wir sind zwei Leute aus Falkensee mit eigenem Gerät, die die überschaubaren Aufträge übernehmen, für die ein solcher Betrieb selten kommt: die Hecke an der Grenze, der Zaun dahinter, die vier Stubben im Rasen, die abgesackte Ecke der Einfahrt. Diese Größe ist der Grund, warum wir einen Festpreis nennen können: Bei der Besichtigung überblicken wir den Aufwand komplett, und wir führen alles selbst aus, ohne Subunternehmer. Was zu groß für uns ist, sagen wir vorher, nicht auf der Baustelle. Für Sie heißt das: keine Mindestauftragsgröße, kein wochenlanges Warten auf ein Angebot, aber auch kein Poolbau und keine Terrasse auf Betonplatte. Dazwischen liegt alles, was diese Seite beschreibt, und das machen wir gründlich."
  - generic [ref=f14e127]:
