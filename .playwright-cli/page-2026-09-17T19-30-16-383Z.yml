  - generic [ref=f14e59]:
    - paragraph [ref=f14e60]:
      - strong [ref=f14e61]: "Kleinere Garten- und Landschaftsbauarbeiten sind Zäune setzen, Hecken entfernen, Flächen roden, Stubben fräsen, Pflaster und Kanten ausbessern und Beete einfassen: alles unterhalb des Großprojekts. Der Haus- & Gartenservice Havelland aus Falkensee führt sie mit einem festen Zwei-Mann-Team aus, zum schriftlichen Festpreis nach kostenloser Besichtigung."
    - heading "GaLaBau im Havelland — was wir bauen und was wir wegmachen" [level=2] [ref=f14e62]
    - 'heading "Zaunbau: Doppelstab, Sichtschutz, Staketen" [level=3] [ref=f14e63]'
    - paragraph [ref=f14e64]:
      - text: "Wir montieren genormte Zaunsysteme: Doppelstabmatten als Standard für Vorgarten und Grenze, blickdichten Sichtschutz aus WPC oder Holz zur Terrasse, Staketenzaun aus Kastanie als günstigen Einstieg, dazu passende Gehtore. Bei der Besichtigung zeigt eine Spatenprobe, ob die Pfosten in Einschlaghülsen stehen können oder ob Eck-, End- und Torpfosten Beton brauchen. Die Leitungsauskunft holen wir ein, bevor das erste Loch entsteht. Den alten Zaun bauen wir auf Wunsch vorher zurück, auch wenn er einbetoniert ist. Sie erhalten einen Festpreis mit ausgewiesenem Materialanteil, keinen Meterpreis und kein Nachverhandeln. Zaunbau ist unsere jüngste Leistung; das erste Projekt in Falkensee mit 33 Laufmetern Staketenzaun ist auf der Zaunbau-Seite mit Zahlen dokumentiert. Dort steht auch der Vergleich der fünf Zaunarten mit Haltbarkeit, Lieferzeit und Projektspanne für 20 Meter."
      - link "Alle Zaunarten und Spannen" [ref=f14e65] [cursor=pointer]:
        - /url: /zaunbau/
      - text: .
    - heading "Heckenentfernung und Rodung" [level=3] [ref=f14e66]
    - paragraph [ref=f14e67]:
      - text: "Soll eine Hecke dauerhaft weg oder ein ganzes Grundstück wieder nutzbar werden, schneiden wir zurück, roden das Wurzelwerk und fahren alles ab. Für Hecken und Gehölze gilt das Zeitfenster vom 1. Oktober bis 28. Februar; von März bis September verbietet § 39 des Bundesnaturschutzgesetzes das Beseitigen zum Schutz brütender Vögel. Gras, Kraut und Wildwuchs ohne Gehölz räumen wir das ganze Jahr über. Vor jedem Termin sehen wir die Hecke auf Nester durch. Typische Fälle: die vertrocknete Thuja-Reihe an der Grenze, der Kirschlorbeer, der nach jedem Schnitt wieder zur Wand wird, oder der geerbte Garten, den seit Jahren niemand betreten hat. Bei der Besichtigung nehmen wir Länge, Höhe, Heckenart und Zufahrt auf und nennen danach einen Festpreis, in dem Abfuhr und Entsorgung des Grünschnitts enthalten sind; zur Orientierung liegt eine Hecke komplett mit Wurzel meist bei 40 bis 90 Euro je laufendem Meter inkl. MwSt. (Stand 2026). Die freie Fläche übergeben wir eben und besenrein, bereit für Zaun, Rasen oder Neupflanzung."
      - link "Zur Heckenentfernung" [ref=f14e68] [cursor=pointer]:
        - /url: /heckenentfernung/
      - text: ·
      - link "Zur Gartenrodung" [ref=f14e69] [cursor=pointer]:
        - /url: /gartenrodung/
      - text: .
    - heading "Stubben fräsen und Wurzeln entfernen" [level=3] [ref=f14e70]
    - paragraph [ref=f14e71]:
      - text: "Ein Baumstumpf im Rasen, die Stubbenreihe der gerodeten Hecke, der Wurzelstock des abgestorbenen Obstbaums: Wir fräsen rund 20 bis 30 Zentimeter unter Bodenniveau, ebnen ein und nehmen das Fräsgut mit; Abfuhr und Entsorgung stecken im Festpreis. Das geht ganzjährig, denn das Fräsen bereits gefällter Stümpfe fällt nicht unter das Winterfenster für Hecken. Ein einzelner Stubben dauert selten länger als eine Stunde, mehrere Stümpfe erledigen wir in einem Termin, was pro Stück günstiger ist als getrennte Anfahrten. Der Preis hängt vor allem am Stammdurchmesser: zur Orientierung 2 bis 5 Euro je Zentimeter inkl. MwSt. (Stand 2026), den verbindlichen Festpreis nennen wir nach der kostenlosen Besichtigung. Dort klären wir auch, ob die Fräse durchs Gartentor passt und ob Leitungen im Boden liegen. Soll an der Stelle gebaut werden, graben wir den Wurzelstock stattdessen komplett aus. Den Baum selbst fällen wir nicht; große Fällungen vermitteln wir an Fachpartner und übernehmen danach die Wurzelarbeit."
      - link "Zum Baumstumpf entfernen" [ref=f14e72] [cursor=pointer]:
        - /url: /baumstumpf-entfernen/
      - text: .
    - heading "Pflaster ausbessern, Kantensteine, Wegeplatten" [level=3] [ref=f14e73]
    - paragraph [ref=f14e74]:
      - text: "Abgesackte Stellen in Einfahrt oder Gartenweg nehmen wir auf, richten den Unterbau neu, verdichten und setzen die Steine wieder ein; gebrochene Platten tauschen wir einzeln aus. Dazu kommen Kantensteine und Rasenkanten, die Beet und Rasen sauber trennen, sowie kurze Wege aus Wegeplatten zum Schuppen oder zur Tonne. Solche Aufträge sind für einen großen Pflasterbetrieb zu klein und für Sie zu mühsam: die Stolperkante vor der Garage, die fehlende Reihe Kantensteine, die drei Platten, die im letzten Winter hochgefroren sind. Wir setzen sie zum Festpreis, ohne Mindestfläche. Ist Ihr Pflaster intakt und nur vermoost oder verschmutzt, reicht statt der Neuverlegung meist eine Steinreinigung; auch die machen wir im Haus. Neue Pflasterflächen ab Neubau und komplette Einfahrten legen wir nicht, dafür sind Erdbau und Unterbau zu groß für unser Team."
      - link "Zur Steinreinigung" [ref=f14e75] [cursor=pointer]:
        - /url: /steinreinigung/
      - text: .
    - heading "Beeteinfassungen und Hochbeete" [level=3] [ref=f14e76]
    - paragraph [ref=f14e77]: "Beeteinfassungen aus Stein, Metall oder Holz geben Beeten eine feste Kante, die das jährliche Nachstechen spart und den Rasenmäher vom Beet fernhält. Wir setzen sie in ein verdichtetes Sand- oder Splittbett und richten sie an der Schnur aus, damit die Linie auch nach dem ersten Winter gerade bleibt. Hochbeete bauen wir aus Holz- oder Metallbausätzen komplett auf, auf Wunsch mit Wühlmausgitter am Boden. Die Befüllung in Schichten aus Grobschnitt, Kompost und Erde übernehmen wir gleich mit, sodass Sie direkt pflanzen können. Solche Arbeiten sind oft der letzte Schritt nach einer Rodung oder einem Zaunbau: erst die freie Fläche, dann die neue Struktur. Wer beides bei uns beauftragt, bekommt einen Festpreis und aufeinander abgestimmte Termine. Das Material stimmen wir vor der Bestellung mit Ihnen ab, damit Farbe und Format zum Haus passen und nichts doppelt gekauft wird."
    - heading "Erst freiräumen, dann bauen" [level=3] [ref=f14e78]
    - paragraph [ref=f14e79]:
      - text: "Auf vielen Grundstücken steht dem neuen Zaun oder Beet noch etwas im Weg: der volle Schuppen, das morsche Gartenhaus, der Hühnerstall vom Vorbesitzer, der Holzhaufen hinter der Garage. Das räumen wir vorher weg, als Entrümpelung mit Abriss und sortenreiner Entsorgung über den Wertstoffhof. Anders als beim Grünschnitt gilt hier: Für Altholz, Metallzaun, Betonfundamente und Sperriges weisen wir die Entsorgungsgebühren nach Beleg aus, zuzüglich Mehrwertsteuer, ohne eigenen Aufschlag. Im Sommer 2026 haben wir im Havelland einen solchen Auftrag in drei Positionen umgesetzt: Schuppen und Garage ausgeräumt, einen Holzhaufen abgefahren, Holzschuppen und Hühnerstall abgerissen und den alten Metallzaun zurückgebaut. Danach war die Fläche frei für das, was der Eigentümer vorhatte. Der Vorteil für Sie: eine Besichtigung, ein Angebot, ein Team, das Räumung, Rückbau und den anschließenden Bau kennt. Sie müssen nicht zwischen Entrümpler, Gärtner und Zaunbauer vermitteln, und niemand steht vor einer Fläche, die der andere noch nicht freigeräumt hat. Was die Entrümpelung genau umfasst, steht auf der eigenen Seite."
      - link "Gartenhaus und Schuppen abreißen" [ref=f14e80] [cursor=pointer]:
        - /url: /entruempelung/#gartenhaus
      - text: .
    - heading "Was wir bewusst nicht anbieten" [level=3] [ref=f14e81]
    - paragraph [ref=f14e82]: "Wir sind ein Zwei-Mann-Team, und das setzt Grenzen, die wir lieber vorher nennen. Komplette Gartenneuanlagen mit Erdbau, Terrassenbau, Poolbau und große Pflasterflächen ab Neubau übernehmen wir nicht. Tiefbau, Drainagen und Leitungsgräben ebenfalls nicht. Stützmauern, gemauerte Sockel und alles, was Statik braucht, gehört zum Maurer- und Bauhandwerk. Beton verarbeiten wir nur dort, wo der Zaunbau ihn braucht: für Eck-, End- und Torpfosten. Bäume fällen wir nicht; Arbeiten mit Seilklettertechnik oder Hubarbeitsbühne und große Fällungen vermitteln wir an Fachpartner und übernehmen danach Stubben und Wurzeln. Zäune über 2 Meter Höhe bauen wir nicht. Passt Ihr Vorhaben nicht zu uns, sagen wir das bei der ersten Rückmeldung per WhatsApp, nicht erst nach der Besichtigung. Kennen wir einen passenden Betrieb aus der Region, nennen wir ihn Ihnen."
    - heading "Kleinere GaLaBau-Arbeiten in Ihrer Nähe" [level=3] [ref=f14e83]
    - paragraph [ref=f14e84]: Der Haus- & Gartenservice Havelland sitzt in Falkensee. GaLaBau-Anfragen aus Falkensee, Dallgow-Döberitz, Brieselang, Schönwalde-Glien, Wustermark, Nauen und Berlin-Spandau haben deshalb kurze Wege, die Anfahrt steckt im Festpreis. Für die erste Einschätzung reicht ein Foto der Stelle per WhatsApp, bei Zaun oder Rodung dazu die ungefähre Länge oder Fläche.
    - heading "So läuft es ab" [level=3] [ref=f14e85]
    - paragraph [ref=f14e86]: Schicken Sie Fotos oder eine Skizze per WhatsApp oder rufen Sie an; die Rückmeldung kommt meist am selben Werktag. Bei der kostenlosen Besichtigung messen wir auf, prüfen Untergrund, Zugang und Leitungen und besprechen das Material. Danach erhalten Sie den Festpreis schriftlich. Bei Grünschnitt, Bewuchs und Fräsgut sind Abfuhr und Entsorgung darin enthalten; bei Rückbau und Sperrigem wie Zaun, Beton oder Altholz weisen wir die Entsorgungsgebühren nach Beleg aus, zuzüglich Mehrwertsteuer. Den Termin legen wir so, dass Hecken- und Gehölzarbeiten im Fenster vom 1. Oktober bis 28. Februar liegen. Nach der Arbeit bekommen Sie die Vorher-Nachher-Fotos aufs Handy.
    - heading "Unsere Garantie" [level=3] [ref=f14e87]
    - paragraph [ref=f14e88]: "Gerade Kanten, fest sitzende Steine, aufgeräumte Baustelle — ist etwas nicht wie besprochen, bessern wir kostenlos nach. Der schriftliche Festpreis bleibt der Endpreis: Grünschnitt und Fräsgut entsorgen wir darin, Entsorgungsgebühren für Rückbau und Sperriges rechnen wir nach Beleg ab, zuzüglich Mehrwertsteuer, ohne eigenen Aufschlag."
