  - generic [ref=f7e62]:
    - heading "Entrümpelung in Falkensee — zuverlässig & lokal" [level=2] [ref=f7e63]
    - paragraph [ref=f7e64]: Falkensee ist die größte Stadt im Havelland, direkt an der Grenze zu Berlin-Spandau und mit Brieselang und Dallgow-Döberitz als Nachbarn. Hinter den vielen Einfamilienhäusern und den älteren Siedlungshäusern stecken über die Jahre volle Keller, Dachböden und Garagen. Wird ein Haushalt gelöst, steht ein Umzug an oder ist einfach über Jahrzehnte zu viel zusammengekommen, räumen wir das diskret aus. Von der Anfrage bis zur besenreinen Übergabe bleibt dieselbe Hand zuständig, und die kurzen Wege aus dem Havelland halten den Termin nah. Ausgeräumt, nicht ausgesessen.
    - paragraph [ref=f7e65]: In Falkensee treffen wir vom schmalen Reihenhauskeller bis zum vollgestellten Einfamilienhaus alles an. Wir sortieren vor Ort, trennen Brauchbares vom Müll und tragen auch aus dem Dachgeschoss und engen Treppenhäusern heraus, ohne dass Sie mit anpacken. Alt-Möbel, Elektrogeräte, Metall und Problemstoffe führen wir getrennt der richtigen Entsorgung zu. Wertgegenstände rechnen wir vorher offen vom Preis ab. Am Ende steht die Fläche besenrein bereit — für die Übergabe an Käufer, Vermieter oder die eigene Weiternutzung.
    - heading "Festpreis & Foto-Nachweis" [level=3] [ref=f7e66]
    - paragraph [ref=f7e67]: Nach der kostenlosen Besichtigung in Falkensee steht ein Festpreis für Räumung und Abtransport, Entsorgungsgebühren nach Beleg. Sie erhalten die Räume besenrein zurück und auf Wunsch Vorher-Nachher-Fotos aufs Handy, auch wenn Sie am Termin selbst nicht dabei sind.
    - paragraph [ref=f7e68]:
      - text: "Mehr zum Thema lesen Sie in unserem Ratgeber:"
      - 'link "Sperrmüll im Havelland anmelden: Regeln, Fristen, Ausnahmen" [ref=f7e69] [cursor=pointer]':
        - /url: /ratgeber/sperrmuell-havelland-anmelden/
      - text: .
  - generic [ref=f7e72]:
    - heading "Entrümpelung in Falkensee — Keller, Garage, Dachboden, Wohnung" [level=2] [ref=f7e73]
    - 'heading "Falkenseer Siedlungshäuser: Keller und Dachboden" [level=3] [ref=f7e74]'
    - paragraph [ref=f7e75]: "Die Deutsche Ansiedlungsbank kaufte 1898 das Rittergut Seegefeld und teilte es in Parzellen. Daraus wuchsen Waldheim, Falkenhain und Neu-Finkenkrug, 1907 kam die Gartenstadt Falkenhagen-West dazu, 1922 Falkenhöh. Viele Häuser aus dieser Zeit stehen noch und sind seit Jahrzehnten in Familienhand. Typisch für sie: ein niedriger Keller mit steiler, schmaler Treppe, darüber ein Spitzboden mit Luke. In beiden Etagen lagert, was seit Jahren niemand angefasst hat: Einmachgläser, Skier, Stühle mit gebrochener Lehne, die Kartons vom Einzug. Wir holen das Stück für Stück heraus, zu zweit bei Sperrigem, und tragen es direkt zum Anhänger vor dem Haus. Auf dem Weg sortieren wir Altholz, Schrott, Elektrogeräte und Restabfall getrennt, weil der Wertstoffhof jede Fraktion einzeln wiegt. Brauchbares bleibt stehen und geht vom Preis ab. Dosen mit Farbe oder Lösungsmittel lassen wir im Keller und nennen Ihnen die Schadstoffannahme am Wertstoffhof Falkensee, wo Privathaushalte sie kostenfrei abgeben."
    - heading "Garage und Schuppen in Falkensee" [level=3] [ref=f7e76]
    - paragraph [ref=f7e77]:
      - text: "Bei einer Garage oder einem Gartenschuppen reicht uns für den ersten Schritt ein Foto per WhatsApp: Tor auf, einmal draufhalten, abschicken. Wir schätzen daraus Menge und Abfallarten ab und melden uns meist am selben Werktag mit einer ersten, unverbindlichen Einschätzung. Den Festpreis für Räumung und Abtransport nennen wir nach der kostenlosen Besichtigung, weil Zufahrt, Untergrund und die Dinge hinter dem Regal auf dem Foto selten zu sehen sind. Im September 2026 haben wir in Falkensee so einen Schuppen zusammen mit einer Abstellkammer geräumt: ein Tag, zwei Fahrten zum Wertstoffhof an der Nauener Straße, danach die Fotos aufs Handy der Kundin. Der Hof nimmt Schrott, Altholz und Restabfall an getrennten Stellen an, deshalb sortieren wir schon beim Beladen. Ölreste, Autobatterien und Gasflaschen bleiben draußen; dafür nennen wir Ihnen die Annahmestelle."
      - link "Gartenhaus abreißen und entsorgen" [ref=f7e78] [cursor=pointer]:
        - /url: /entruempelung/#gartenhaus
      - text: .
    - heading "Wohnung und Haus in Falkensee — auch ohne Ihre Anwesenheit" [level=3] [ref=f7e79]
    - paragraph [ref=f7e80]:
      - text: Wer ein Elternhaus in Finkenkrug verkauft oder eine leer stehende Wohnung in Seegefeld abgibt, wohnt nicht unbedingt in Falkensee. Sie müssen für die Räumung nicht anreisen. Den Schlüssel übernehmen wir von einer Vertrauensperson, einem Nachbarn oder der Hausverwaltung; eine kurze schriftliche Vollmacht regelt, was weg darf und was bleibt. Was Sie behalten wollen, markieren Sie vorher mit Klebeband oder schicken uns eine Liste per WhatsApp. Wir räumen Zimmer für Zimmer, laden Möbel, Elektrogeräte und Hausrat sortiert auf und fahren so oft zum Wertstoffhof, wie es braucht; der liegt in Falkensee wenige Minuten entfernt. Nach jeder Etappe bekommen Sie Fotos, nach der Übergabe die Rechnung mit allen Entsorgungsbelegen per Mail. Geht es um den kompletten Haushalt nach einem Todesfall oder dem Umzug ins Pflegeheim, mit Sichten von Dokumenten und Wertsachen vorab, ist das eine Haushaltsauflösung mit eigener Seite für Falkensee.
      - link "Haushaltsauflösung in Falkensee" [ref=f7e81] [cursor=pointer]:
        - /url: /haushaltsaufloesung-falkensee/
      - text: .
    - 'heading "Gewerbe in Falkensee: Büro, Praxis, Lager" [level=3] [ref=f7e82]'
    - paragraph [ref=f7e83]:
      - text: "Gewerberäume in Falkensee räumen wir außerhalb Ihrer Öffnungszeiten, nach Feierabend oder samstags, damit Kunden und Patienten nichts davon mitbekommen: die Praxis, die den Standort wechselt, das Ladenlokal vor der Rückgabe an den Vermieter, das volle Lager. Büromöbel, Regalsysteme, Ladentheken, Rechner und Restbestände nehmen wir sortiert mit und fahren sie zum Wertstoffhof Falkensee. Jeden Beleg von dort bekommt Ihre Buchhaltung als Entsorgungsnachweis, unsere Rechnung weist die Mehrwertsteuer aus; bei mehreren Objekten fassen wir alles auf einer Sammelrechnung zusammen, wenn Sie das wollen. Aktenordner mit Kundendaten vernichten wir nicht selbst, damit die Datenschutzkette geschlossen bleibt; dafür vermitteln wir einen Fachbetrieb für Aktenvernichtung und stimmen den Termin mit ab. Bei einer Räumung zur Rückgabe an den Vermieter halten wir den leeren Zustand mit Fotos fest. Der Weg ist derselbe wie beim Privathaushalt: Fotos oder Grundriss per Mail, kostenlose Besichtigung, schriftlicher Festpreis für Räumung und Abtransport, Entsorgung nach Beleg."
      - link "Mehr zur Gewerbe-Entrümpelung" [ref=f7e84] [cursor=pointer]:
        - /url: /entruempelung/#gewerbe
      - text: .
