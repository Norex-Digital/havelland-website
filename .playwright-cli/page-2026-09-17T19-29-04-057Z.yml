  - generic [ref=f7e105]:
    - heading "Falkenhagen, Finkenkrug, Seegefeld, Waldheim — wo wir unterwegs sind" [level=2] [ref=f7e106]
    - paragraph [ref=f7e107]: "Die Stadt Falkensee führt sieben Wohngebiete. Falkenhagen, 1336 erstmals erwähnt, ist einer der beiden Gründungsorte von 1923, mit dem alten Dorf und der Gartenstadt Falkenhagen-West von 1907. Seegefeld, schon 1265 erwähnt, bekam 1846 die Bahnstation an der Strecke Berlin–Hamburg, aus der der heutige Bahnhof Falkensee wurde, und ist mit 6,88 km² das größte Wohngebiet. Finkenkrug geht auf das Gasthaus Alter Finkenkrug von 1777 an der Nauener Straße zurück, die Kolonie Neu-Finkenkrug folgte 1898; der Alte Finkenkrug ist mit 0,21 km² das kleinste Gebiet. Waldheim, Falkenhain und Falkenhöh entstanden als Kolonien auf den Parzellen von 1898 und 1922. Für uns heißt das: Jedes Wohngebiet liegt von der Darmstädter Straße aus wenige Minuten entfernt, und der Wertstoffhof im Gewerbegebiet Nord ist auf fast jeder Strecke nah. Ob Kellerräumung in Finkenkrug, Garage in Falkenhöh oder Dachboden in Waldheim: Wir kommen mit dem Anhänger direkt vors Grundstück, und bei mehreren Fahrten geht keine Stunde für die Strecke verloren."
  - generic [ref=f7e110]:
    - heading "Was eine Entrümpelung in Falkensee kostet — ein echtes Beispiel" [level=2] [ref=f7e111]
    - paragraph [ref=f7e112]:
      - text: "Ein Auftrag aus Falkensee vom September 2026, Abstellkammer und Gartenschuppen: Der Festpreis für Räumung und Abtransport lag bei 1.190 € inkl. MwSt., ein Tag Arbeit, zwei Fahrten zum Wertstoffhof Falkensee. Auf den beiden Belegen des Wertstoffhofs standen zusammen 458 € Entsorgungsgebühren, darunter gemischter Siedlungsabfall und Altholz nach Gewicht. Diese Gebühren geben wir nach Beleg weiter, zuzüglich Mehrwertsteuer, ohne eigenen Aufschlag; sie stehen im Angebot und in der Rechnung als eigene Zeile. Das ist ein Beispiel, kein Pauschalpreis. Bei Ihnen entscheiden vier Dinge über den Betrag: die Menge, der Zugang (Kellertreppe, Dachluke, Weg zum Anhänger), die Zahl der Fahrten und der Anteil an Brauchbarem, den wir anrechnen. Weil der Wertstoffhof in Falkensee liegt, kostet eine dritte oder vierte Fahrt wenig Zeit, und das merken Sie bei größeren Kellern oder ganzen Wohnungen im Festpreis. Den Preis für Ihre Räumung nennen wir nach der kostenlosen Besichtigung schriftlich."
      - link "Mehr zu den Preisfaktoren" [ref=f7e113] [cursor=pointer]:
        - /url: /ratgeber/entruempelung-kosten/
      - text: .
