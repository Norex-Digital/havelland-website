  - generic [ref=f8e62]:
    - heading "Entrümpelung in Brieselang — zuverlässig & lokal" [level=2] [ref=f8e63]
    - paragraph [ref=f8e64]: Brieselang liegt zwischen Falkensee und Wustermark am Rand des Brieselanger Forsts, mit Nauen als westlichem Nachbarn. Viele Bewohner pendeln nach Berlin und haben abends wenig Zeit für die großen Aufräumaktionen, die sich in Keller, Schuppen und Dachboden ansammeln. Wenn ein Haus den Besitzer wechselt, ein Angehöriger versorgt werden muss oder der Gartenschuppen überquillt, räumen wir das für Sie aus. Wir kennen die Wege nach Falkensee, Wustermark und Nauen und sind schnell vor Ort. Ihr Feierabend bleibt Ihrer.
    - paragraph [ref=f8e65]: In Brieselang reicht die Bandbreite vom Gartenschuppen am Waldrand bis zum kompletten Hausrat. Wir räumen Keller, Dachboden, Garage und Nebengebäude, tragen selbst heraus und laden auf. Alles Brauchbare trennen wir vom Müll; Sperrmüll, Alt-Elektro, Metall und Problemstoffe führen wir jeweils der richtigen Stelle zu. Wertgegenstände rechnen wir offen an. Container, Transport und Entsorgung übernehmen wir komplett, damit Sie sich um nichts kümmern müssen. Zurück bleibt eine besenreine Fläche.
    - heading "Festpreis & Foto-Nachweis" [level=3] [ref=f8e66]
    - paragraph [ref=f8e67]: Nach der kostenlosen Besichtigung in Brieselang bekommen Sie einen Festpreis für Räumung und Abtransport; Entsorgungsgebühren nach Beleg. Auf Wunsch dokumentieren wir das Ergebnis mit Vorher-Nachher-Fotos, damit Sie auch aus dem Büro oder von unterwegs sehen, dass alles erledigt ist.
    - paragraph [ref=f8e68]:
      - text: "Mehr zum Thema lesen Sie in unserem Ratgeber:"
      - 'link "Gartenhaus abreißen und entsorgen: Kosten, Ablauf, Regeln" [ref=f8e69] [cursor=pointer]':
        - /url: /ratgeber/gartenhaus-abreissen-entsorgen/
      - text: .
  - generic [ref=f8e72]:
    - heading "Entrümpelung in Brieselang — Keller, Garage, Dachboden, Wohnung" [level=2] [ref=f8e73]
    - 'heading "Brieselang: Pendlerort mit Alt- und Neubestand" [level=3] [ref=f8e74]'
    - paragraph [ref=f8e75]: "Brieselang ist eine junge Gemeinde: am 14. Januar 1925 als Landgemeinde gegründet, gewachsen aus den Siedlungsgesellschaften, die sich ab 1920 am Rand des Brieselanger Forsts zusammenfanden. Seit 2003 gehören die alten Dörfer Bredow und Zeestow dazu, heute leben rund 13.500 Menschen in der Gemeinde. Der Bahnhof Brieselang hat Regionalbahn-Anschluss Richtung Berlin, und wer dort arbeitet, ist tagsüber nicht zu Hause. Der Ort hat deshalb zwei Gesichter: Siedlungshäuser aus den ersten Jahrzehnten mit Keller, Spitzboden und Schuppen, und neuere Einfamilienhäuser mit Carport und Garage. Wenn Sie tagsüber in Berlin oder unterwegs sind, räumen wir in beiden das, was sich angesammelt hat. Sie geben uns den Schlüssel oder sind am Samstag dabei; auf Ihr Foto per WhatsApp melden wir uns meist am selben Werktag."
    - heading "Keller und Dachboden im Altbestand" [level=3] [ref=f8e76]
    - paragraph [ref=f8e77]: "Ein Siedlungshaus aus den Gründungsjahren hat meist einen niedrigen Keller mit schmaler Treppe und darüber einen Spitzboden mit Stiege oder Luke. Beides zusammen ergibt die Räumung, die Sie sich als Pendler am Feierabend nicht antun wollen: Regale voller Gläser, Koffer, Matratzen, das Kinderbett, alte Vorhänge. Wir kommen zu zweit, tragen alles über Treppe und Luke nach unten und laden es vor dem Haus auf den Anhänger. Loses Material wie alte Isolierung oder Staub packen wir in Säcke, Möbel zerlegen wir, wenn sie sonst nicht durch die Tür passen. Platten mit Asbestverdacht oder alte Mineralwolle rühren wir nicht an und nennen Ihnen einen Fachbetrieb. Am Ende fegen wir Keller und Boden aus und schicken Ihnen die Fotos am selben Tag, damit Sie das Ergebnis schon in der Bahn sehen."
    - heading "Garage, Carport und Schuppen" [level=3] [ref=f8e78]
    - paragraph [ref=f8e79]:
      - text: "Am Waldrand steht der Schuppen, unter dem Carport stapeln sich Bretter, Reifen und die Fahrräder, die niemand mehr fährt. Für diese Räumungen brauchen wir am Anfang kein Aufmaß: Ein Foto mit dem Handy, einmal quer durch den Schuppen, reicht für eine erste, unverbindliche Einschätzung. Nach der kostenlosen Besichtigung steht der Festpreis für Räumung und Abtransport schriftlich fest. Beim Beladen trennen wir Altholz, Schrott und Restabfall, weil der Wertstoffhof jede Sorte auf der Waage einzeln abrechnet und Schrott ohne Gebühr annimmt. Ölreste, Autobatterien und Gasflaschen nehmen wir nicht mit; wir sagen Ihnen, wo Sie sie abgeben. Ist der Schuppen selbst hinüber, kommt er nach dem Ausräumen mit weg, Holz und Dachpappe getrennt nach Beleg. Anschließend fegen wir durch, und das Auto passt wieder unters Dach."
      - link "Warum Nebengebäude unsere häufigsten Aufträge sind" [ref=f8e80] [cursor=pointer]:
        - /url: /entruempelung/#nebengebaeude
      - text: .
    - heading "Wohnung und Haus in Brieselang, auch per Vollmacht" [level=3] [ref=f8e81]
    - paragraph [ref=f8e82]:
      - text: "Ein Haus in Brieselang wechselt den Besitzer, die Kinder wohnen in Berlin oder weiter weg, und die Räumung soll laufen, ohne dass jemand Urlaub nimmt. Das geht: Sie hinterlegen den Schlüssel bei einem Nachbarn oder übergeben ihn uns bei der Besichtigung, dazu eine kurze schriftliche Vollmacht, welche Räume leer werden und was stehen bleibt. Wir räumen Zimmer für Zimmer, laden Möbel, Teppiche, Hausrat und Elektrogeräte sortiert auf und fahren zum Wertstoffhof nach Falkensee, zehn Minuten entfernt. Nach jeder Etappe bekommen Sie Fotos, am Ende die Aufnahmen der leeren, gefegten Räume und per Mail die Rechnung samt Entsorgungsbelegen. Soll vorher der Nachlass gesichtet werden, mit Dokumenten, Schmuck und Fotoalben, die zu Ihnen kommen, ist das eine Haushaltsauflösung mit eigenem Ablauf."
      - link "Zur Haushaltsauflösung" [ref=f8e83] [cursor=pointer]:
        - /url: /haushaltsaufloesung/
      - text: .
  - generic [ref=f8e86]:
    - 'heading "Entsorgung in Brieselang: Wertstoffhof, Sperrmüll, Anfahrt" [level=2] [ref=f8e87]'
    - generic [ref=f8e88]:
      - generic [ref=f8e89]:
        - term [ref=f8e90]: Wertstoffhof
        - definition [ref=f8e91]: "Der nächstgelegene Wertstoffhof ist Falkensee, Nauener Straße 97: vom Brieselanger Ortskern rund 6 km, etwa 10 Minuten Fahrt. Nauen/Schwanebeck (Schwanebecker Weg 25) liegt rund 19 km entfernt; nur von Bredow aus sind beide ähnlich weit. Falkensee ist geöffnet Montag 9–18 Uhr, Dienstag bis Freitag 9–17 Uhr, Samstag 8–13 Uhr; Gebühren nach Gewicht laut Satzung 2026."
      - generic [ref=f8e92]:
        - term [ref=f8e93]: Sperrmüll
        - definition [ref=f8e94]: Zweimal im Jahr kostenlos für Privathaushalte, angemeldet bei der HAW mbH, Wartezeit bis zu vier Wochen, Bereitstellung frühestens am Vorabend vor dem Grundstück. Bauabfälle, Fenster, Türen, Laminat, Bretter aus dem Garten und größere Mengen aus Haushaltsauflösungen lässt die Abfuhr stehen.
      - generic [ref=f8e95]:
        - term [ref=f8e96]: Anfahrt
        - definition [ref=f8e97]: Vom Sitz des Haus- & Gartenservice Havelland in Falkensee bis nach Brieselang sind es rund 7 km, etwa 10 Minuten Fahrt; nach Bredow gut 12 km. Der Wertstoffhof Falkensee liegt im Nordwesten der Stadt, also auf dem Weg nach Brieselang.
      - generic [ref=f8e98]:
        - term [ref=f8e99]: Ortsteile
        - definition [ref=f8e100]: Brieselang mit Bahnhof und Regionalbahn-Anschluss Richtung Berlin, dazu die Ortsteile Bredow (1208 erstmals erwähnt) und Zeestow (1346), seit 2003 eine Gemeinde mit 44,39 km²; rund 13.500 Einwohner (Stand Mai 2024), PLZ 14656.
    - paragraph [ref=f8e101]: "Quelle: abfall-havelland.de, Abfallgebührensatzung Landkreis Havelland 2026, haw-mbh.de, gemeindebrieselang.de (Unsere Gemeinde, Geschichte der drei Ortsteile), Fahrzeiten per OSRM-Routing auf OpenStreetMap-Daten (ca.-Werte), Stand 09/2026"
  - generic [ref=f8e104]:
    - heading "Was wir in Brieselang typischerweise vorfinden" [level=2] [ref=f8e105]
    - paragraph [ref=f8e106]: "Einen abgeschlossenen Auftrag aus Brieselang mit Fotos und Zahlen können wir noch nicht zeigen. Zeigen können wir den Auftrag aus dem Nachbarort Falkensee vom September 2026: Abstellkammer und Gartenschuppen, 1.190 € inkl. MwSt. Festpreis für Räumung und Abtransport, dazu 458 € Wertstoffhof-Gebühren nach Beleg. Die Häuser in Brieselang stammen aus derselben Siedlungszeit wie viele in Falkensee, Falkenhöh entstand 1922, die Brieselanger Siedlungsgesellschaften begannen 1920. Deshalb erwarten wir in Brieselang dieselben Aufgaben: der Keller, in dem seit dem Einzug die Kartons stehen; die Garage, in der kein Auto mehr Platz hat; der Schuppen am Waldrand mit Gartengeräten, Farbresten und Brennholz; das Elternhaus, das nach dem Verkauf leer übergeben wird. Und weil der nächste Wertstoffhof in Falkensee liegt, zehn Minuten entfernt, fahren wir bei einem Brieselanger Auftrag denselben Weg wie bei uns zu Hause. Sobald wir einen Auftrag aus Brieselang mit Einwilligung zeigen dürfen, steht er hier."
  - generic [ref=f8e109]:
    - heading "So läuft eine Entrümpelung in Brieselang ab" [level=2] [ref=f8e110]
    - paragraph [ref=f8e111]: "Erstens schicken Sie ein Foto per WhatsApp oder rufen an, gern aus dem Zug. Zweitens melden wir uns meist am selben Werktag mit einer ersten, unverbindlichen Einschätzung; bei einer einzelnen Garage oder einem Schuppen reicht das Foto dafür oft aus. Drittens kommt Noah Telo zur kostenlosen Besichtigung nach Brieselang, nach Feierabend oder am Samstag, wenn Sie das brauchen; wir sehen uns Menge, Zugang, Zufahrt und die Abfallarten an. Viertens bekommen Sie den Festpreis für Räumung und Abtransport schriftlich, die Entsorgungsgebühren des Wertstoffhofs kommen nach Beleg dazu, zuzüglich Mehrwertsteuer, ohne Aufschlag. Fünftens der Termin: Wir räumen aus, sortieren Brauchbares heraus und rechnen es an, fahren nach Falkensee zum Wertstoffhof und übergeben besenrein. Sechstens landen die Vorher-Nachher-Fotos auf Ihrem Handy, die Rechnung mit den Belegen per Mail. Bei keinem dieser Schritte müssen Sie persönlich dabei sein; Schlüssel und Vollmacht reichen."
  - img "Haus- & Gartenservice in Brieselang und Umgebung" [ref=f8e116]
