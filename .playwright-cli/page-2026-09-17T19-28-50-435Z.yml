    - generic [ref=f6e24]: Ratgeber
    - 'heading "Wertstoffhof Falkensee: Öffnungszeiten, Gebühren, Annahme" [level=1] [ref=f6e25]'
    - paragraph [ref=f6e26]: Adresse, Öffnungszeiten und Gebühren des Wertstoffhofs Falkensee im Überblick — mit den aktuellen Sätzen der Abfallgebührensatzung 2026.
  - 'img "Wertstoffhof Falkensee: Öffnungszeiten, Gebühren, Annahme — Ratgeber Haus- & Gartenservice Havelland" [ref=f6e31]'
  - generic [ref=f6e34]:
    - generic [ref=f6e35]:
      - generic [ref=f6e36]: Die kurze Antwort
      - paragraph [ref=f6e37]: Der Wertstoffhof Falkensee liegt in der Nauener Straße 97. Geöffnet ist montags von 9 bis 18 Uhr, dienstags bis freitags von 9 bis 17 Uhr und samstags von 8 bis 13 Uhr. Sperrmüll, Schrott, Elektroaltgeräte, Leuchtstoffröhren und Schadstoffe nehmen die Mitarbeiter von Privathaushalten kostenfrei an, alle übrigen Abfälle werden auf der Fahrzeugwaage gewogen und nach Gewicht abgerechnet. Angaben laut Betreiber, Stand 17.09.2026. Bitte vor der Fahrt prüfen.
    - heading "Adresse und Öffnungszeiten" [level=2] [ref=f6e38]
    - paragraph [ref=f6e39]: "Der Wertstoffhof Falkensee, umgangssprachlich auch Recyclinghof Falkensee genannt, wird von der Abfallbehandlungsgesellschaft Havelland mbH (Schwanebecker Weg 25, 14641 Nauen) im Auftrag des Landkreises Havelland, Sachgebiet Abfallentsorgung, betrieben. Die Adresse des Hofs selbst: Nauener Straße 97, 14612 Falkensee, im Gewerbegebiet Nord an der Straße Richtung Brieselang und Nauen."
    - table [ref=f6e40]:
      - rowgroup [ref=f6e41]:
        - row [ref=f6e42]:
          - columnheader "Tag" [ref=f6e43]
          - columnheader "Uhrzeit" [ref=f6e44]
        - row [ref=f6e45]:
          - cell "Montag" [ref=f6e46]
          - cell "9–18 Uhr" [ref=f6e47]
        - row [ref=f6e48]:
          - cell "Dienstag–Freitag" [ref=f6e49]
          - cell "9–17 Uhr" [ref=f6e50]
        - row [ref=f6e51]:
          - cell "Samstag" [ref=f6e52]
          - cell "8–13 Uhr" [ref=f6e53]
    - paragraph [ref=f6e54]:
      - text: Für Rückfragen zur Anlieferung ist die Abfallberatung des Betreibers unter 03321 748946 erreichbar, die des Landkreises Havelland unter 03321 4035418. Getrennte Sommer- oder Winteröffnungszeiten nennt die Betreiberseite nicht. Die oben genannten Zeiten gelten laut aktueller Veröffentlichung ganzjährig. Feiertage und kurzfristige Änderungen prüfen Sie am besten direkt beim Betreiber; die jeweils aktuellen Zeiten stehen auf
      - link "abfall-havelland.de" [ref=f6e55] [cursor=pointer]:
        - /url: https://www.abfall-havelland.de/index.php?page_id=544
      - text: .
    - 'heading "Annahmeliste: Was der Wertstoffhof annimmt und was nicht" [level=2] [ref=f6e56]'
    - paragraph [ref=f6e57]: "Der Wertstoffhof Falkensee nimmt alle Abfallarten laut Gebührensatzung in haushaltsüblichen Mengen an. Dazu zählen laut Betreiber:"
    - list [ref=f6e58]:
      - listitem [ref=f6e59]: Sperrmüll
      - listitem [ref=f6e60]: Schrott
      - listitem [ref=f6e61]: Papier und Pappe
      - listitem [ref=f6e62]: Elektroaltgeräte
      - listitem [ref=f6e63]: Leuchtstoffröhren und Energiesparlampen
      - listitem [ref=f6e64]: Schadstoffe
      - listitem [ref=f6e65]: Althandys, CDs und DVDs
      - listitem [ref=f6e66]: Druckerpatronen und Kartuschen
      - listitem [ref=f6e67]: Gartenabfälle und kompostierbare Abfälle
    - paragraph [ref=f6e68]: "Nicht angenommen werden dagegen:"
    - list [ref=f6e69]:
      - listitem [ref=f6e70]: Gelbe Säcke
      - listitem [ref=f6e71]: Gasflaschen und weitere Druckbehälter
    - paragraph [ref=f6e72]: "Wer unsicher ist, ob eine bestimmte Abfallart dazugehört, fragt am besten vorab telefonisch beim Betreiber nach: Die Annahmeliste kann sich ändern, und eine vergebliche Fahrt kostet Zeit. Die obige Liste bildet den Stand der Betreiberveröffentlichung vom 17.09.2026 ab und gilt für Anlieferungen in haushaltsüblicher Menge; bei größeren Mengen nimmt der Betreiber vor Ort eine eigene Einordnung vor."
    - 'heading "Gebühren 2026: was kostenlos ist und was gewogen wird" [level=2] [ref=f6e73]'
    - paragraph [ref=f6e74]: "Aus privaten Haushalten sind diese Abfallarten kostenfrei, weil sie über die Basisgebühr abgegolten sind (§ 3 Abs. 1.1 Abfallgebührensatzung 2026):"
    - list [ref=f6e75]:
      - listitem [ref=f6e76]: Sperrmüll
      - listitem [ref=f6e77]: Schrott
      - listitem [ref=f6e78]: Papier und Pappe
      - listitem [ref=f6e79]: Elektroaltgeräte
      - listitem [ref=f6e80]: Leuchtstoffröhren
      - listitem [ref=f6e81]: Schadstoffe
    - paragraph [ref=f6e82]: "Alle anderen Anlieferungen werden auf der Fahrzeugwaage gewogen und nach Gewicht abgerechnet (§ 3 Abs. 3.2); für Kleinmengen unter der Mindestlast gilt eine Volumenpauschale je Abfallart (Anlage 3 Teil II). Die Gebührensätze 2026 laut Anlage 3 Teil I:"
    - table [ref=f6e83]:
      - rowgroup [ref=f6e84]:
        - row [ref=f6e85]:
          - columnheader "Abfallart" [ref=f6e86]
          - columnheader "€/kg" [ref=f6e87]
        - row [ref=f6e88]:
          - cell "Gemischte Siedlungsabfälle" [ref=f6e89]
          - cell "0,32" [ref=f6e90]
        - row [ref=f6e91]:
          - cell "Altholz A1–A4" [ref=f6e92]
          - cell "0,36" [ref=f6e93]
        - row [ref=f6e94]:
          - cell "Sperrmüll, sonstige Herkunft" [ref=f6e95]
          - cell "0,31" [ref=f6e96]
        - row [ref=f6e97]:
          - cell "Schrott" [ref=f6e98]
          - cell "0,00" [ref=f6e99]
        - row [ref=f6e100]:
          - cell "Teer-/Bitumenpappe mit Nachweis" [ref=f6e101]
          - cell "0,70" [ref=f6e102]
        - row [ref=f6e103]:
          - cell "Kunststoffe a. n. g." [ref=f6e104]
          - cell "0,40" [ref=f6e105]
    - paragraph [ref=f6e106]: "Vor Ort gilt: nur Barzahlung, Müllsäcke 5,50 € je Stück, Big Bags 9,00 € je Stück. Stand: Abfallgebührensatzung 2026, Kreistag Havelland vom 15.12.2025."
    - heading "So läuft die Anlieferung ab" [level=2] [ref=f6e107]
    - paragraph [ref=f6e108]: "Jedes Fahrzeug wird auf der Waage erfasst: beladen bei der Einfahrt, leer bei der Ausfahrt, die Differenz ergibt das abzurechnende Gewicht. Kostenfreie Fraktionen wie Sperrmüll oder Elektroschrott sortieren Sie vor Ort in den zugehörigen Container, kostenpflichtige Fraktionen weist der Betreiber nach Gewicht auf dem Beleg aus."
    - paragraph [ref=f6e109]: Aus einem eigenen Auftrag in Falkensee liegen uns zwei solcher Belege vor. Auf ihnen standen zusammen 458 € für Siedlungsabfall und Altholz aus einer Abstellkammer und einem Gartenschuppen, verteilt auf zwei Fahrten zum Hof. Das zeigt, wie schnell sich Gewicht bei Renovierungs- oder Räumgut summiert. Allein Altholz kostet 0,36 € pro Kilogramm.
    - paragraph [ref=f6e110]: Wer die Menge vorab realistisch einschätzen will, wiegt zuhause grob nach (Kofferraum, Anhänger) oder fragt vor dem Abladen am Hof nach einer Einschätzung.
    - heading "Zu viel für den Anhänger? Wir holen ab" [level=2] [ref=f6e111]
    - paragraph [ref=f6e112]: "Nicht jede Räumung passt auf einen Anhänger oder in mehrere Fahrten zum Wertstoffhof: vollgestellte Keller, aufgelöste Haushalte oder ganze Schuppen brauchen oft mehr Ladefläche und Zeit, als ein Wochenende erlaubt. Solche Mengen betreffen häufig Nachlassauflösungen, Kellerentrümpelungen oder das Räumen eines Gartenhauses vor dem Verkauf: Situationen, in denen mehrere Fahrten zum Hof allein aus Zeitgründen nicht praktikabel sind."
    - paragraph [ref=f6e113]: Haus- & Gartenservice Havelland übernimmt Räumung und Abtransport zum Festpreis nach einer kostenlosen Besichtigung. Die Entsorgungsgebühren der Annahmestellen rechnen wir danach nach Beleg ab, zuzüglich Mehrwertsteuer und ohne eigenen Aufschlag. Sie müssen dafür nicht selbst zum Hof fahren, warten oder wiegen.
    - paragraph [ref=f6e114]:
      - text: "Ablauf und Preisfaktoren im Detail:"
      - link "Entrümpelung im Havelland" [ref=f6e115] [cursor=pointer]:
        - /url: /entruempelung/
      - text: .
    - heading "Andere Wertstoffhöfe im Landkreis" [level=2] [ref=f6e116]
    - paragraph [ref=f6e117]: "Der Landkreis Havelland betreibt neben Falkensee zwei weitere Wertstoffhöfe:"
    - list [ref=f6e118]:
      - listitem [ref=f6e119]:
        - strong [ref=f6e120]: Nauen/Schwanebeck
        - text: ": Schwanebecker Weg 25, 14641 Nauen OT Schwanebeck (mit Deponie Schwanebeck). Öffnungszeiten laut Betreiber nicht veröffentlicht, Auskunft vor Ort."
      - listitem [ref=f6e121]:
        - strong [ref=f6e122]: Rathenow/Bölkershof
        - text: ": Bölkershof 8, Rathenow. Öffnungszeiten laut Betreiber nicht veröffentlicht, Auskunft vor Ort."
    - paragraph [ref=f6e123]: Für Falkensee, Dallgow-Döberitz, Schönwalde-Glien und Brieselang ist der Hof in Falkensee der nächstgelegene; Wustermark und Brieselang liegen etwa zwischen Falkensee und Nauen/Schwanebeck. Da sich die Zeiten der beiden anderen Höfe von Falkensee unterscheiden können, fragen Sie am besten direkt beim Betreiber nach, bevor Sie losfahren.
