  - generic [ref=f2e99]:
    - 'heading "Nebengebäude zuerst: Warum Keller, Garage und Schuppen unsere häufigsten Aufträge sind" [level=2] [ref=f2e100]'
    - paragraph [ref=f2e101]: "Das Havelland ist eine Region der Einfamilienhäuser, und zu fast jedem gehören Keller, Garage, Schuppen oder Gartenhaus. Dort sammelt sich, was im Wohnhaus stört, aber zu schade zum Wegwerfen scheint. Nach zwanzig Jahren ist der Schuppen voll, und die kommunale Sperrmüllabfuhr nimmt weder Bretter aus dem Garten noch Bauabfälle mit. Genau diese Aufträge bekommen wir am häufigsten, und dafür sind wir ausgerüstet: ein Zwei-Mann-Team und ein Anhänger. In Falkensee haben wir zuletzt eine Abstellkammer unter der Treppe und einen vollen Gartenschuppen an einem Tag geräumt, mit zwei Fahrten zum Wertstoffhof Falkensee. Der Vorteil für Sie: Nebengebäude lassen sich vom Foto aus gut einschätzen, die Besichtigung geht schnell, und Sie müssen den Wohnbereich nicht freiräumen. Was verwertbar ist, rechnen wir an, der Rest geht sortiert zum Wertstoffhof, die Gebühren weisen wir nach Beleg aus."
  - generic [ref=f2e104]:
    - heading "Gartenhaus abreißen und entsorgen" [level=2] [ref=f2e105]
    - paragraph [ref=f2e106]:
      - text: "Ein Gartenhaus, das nicht mehr sicher steht, bauen wir nach dem Ausräumen zurück und entsorgen es sortenrein: Holz zum Altholz, Dachpappe getrennt, Metallteile zum Schrott. Der Wertstoffhof wiegt jede Abfallart einzeln und rechnet sie nach eigenem Satz ab, Schrott zum Beispiel ohne Gebühr. Getrennt geladen sehen Sie auf dem Beleg, was welche Fraktion gekostet hat. Im Sommer 2026 haben wir im Havelland einen solchen Auftrag in drei Positionen umgesetzt. Erst Schuppen und Garage ausgeräumt, samt Demontage von Schränken und Einbauten, dazu einen Holzhaufen verladen und abtransportiert. Danach Holzschuppen und Hühnerstall abgerissen und den alten Metallzaun zurückgebaut, die Entsorgung nach Wertstoffhof-Beleg. Ob der Abriss eine Genehmigung braucht, hängt von Größe und Lage ab; das klären Sie vorab mit Ihrer Gemeinde, wir sagen Ihnen, was uns bei der Besichtigung auffällt. Soll danach eine Terrasse, ein Weg oder ein neuer Zaun entstehen, übernehmen wir auch kleinere GaLaBau-Arbeiten."
      - link "Kleinere GaLaBau-Arbeiten" [ref=f2e107] [cursor=pointer]:
        - /url: /galabau/
      - text: .
  - generic [ref=f2e110]:
    - 'heading "Gewerbe-Entrümpelung: Büro, Lager, Praxis" [level=2] [ref=f2e111]'
    - paragraph [ref=f2e112]: "Für Büros, Lager, Läden und Praxen im Havelland räumen wir außerhalb Ihrer Geschäftszeiten, abends oder am Wochenende, damit der Betrieb weiterläuft. Schreibtische, Regale, Ladeneinrichtung, Elektrogeräte und Restbestände laden wir sortiert und fahren sie zum Wertstoffhof. Jeden Entsorgungsbeleg bekommen Sie als Nachweis für die Buchhaltung, dazu unsere Rechnung mit ausgewiesener Mehrwertsteuer. Akten mit personenbezogenen Daten vernichten wir nicht selbst; dafür vermitteln wir einen Fachbetrieb für Aktenvernichtung, damit die Datenschutzkette geschlossen bleibt. Der Ablauf ist derselbe wie beim Privathaushalt: Fotos oder Grundriss per Mail, kostenlose Besichtigung, schriftlich zugesagter Preis für Räumung und Abtransport, Entsorgungsgebühren nach Beleg. Bei einer Räumung zur Übergabe an den Vermieter dokumentieren wir den leeren Zustand mit Fotos."
  - generic [ref=f2e115]:
    - 'heading "Ihr Ansprechpartner im Havelland: Noah Telo" [level=2] [ref=f2e116]'
    - paragraph [ref=f2e117]: "Noah Telo führt den Haus- & Gartenservice Havelland und ist für die Entrümpelung zuständig. Er meldet sich persönlich auf Ihr Foto, kommt selbst zur Besichtigung, schreibt das Angebot und steht am Räumungstag mit am Anhänger. Vom ersten Anruf bis zur Abnahme haben Sie also ein Gesicht und eine Nummer, kein Callcenter und keine wechselnden Kolonnen. Bei größeren Räumungen arbeitet er im Zwei-Mann-Team mit seinem Mitgründer. Das Foto zeigt ihn bei der Arbeit im Havelland, beim Heckenschnitt. Wenn Sie vorher wissen wollen, wer bei Ihnen im Keller steht: Das ist er."
    - figure [ref=f2e118]:
      - img "Noah Telo beim Heckenschnitt im Havelland" [ref=f2e120]
  - generic [ref=f2e123]:
    - heading "Unsere Übergabe-Garantie" [level=2] [ref=f2e124]
    - paragraph [ref=f2e125]:
      - strong [ref=f2e126]: Ihr Preis bleibt Ihr Preis — auch wenn der Tag länger wird.
    - paragraph [ref=f2e127]: "Konkret heißt das: Dauert die Räumung länger als gedacht, weil hinter dem Regal noch ein zweites stand, zahlen Sie trotzdem den vereinbarten Preis. Für die Entsorgung sehen Sie die Wiegescheine des Wertstoffhofs und zahlen die dort ausgewiesene Gebühr zuzüglich der gesetzlichen Mehrwertsteuer, ohne Aufschlag von uns. Übergeben wird besenrein zu dem Termin, den wir vereinbart haben; sind Sie nicht vor Ort, bekommen Sie die Vorher-Nachher-Fotos aufs Handy und prüfen in Ruhe."
  - generic [ref=f2e130]:
    - heading "Unterschied Entrümpelung und Haushaltsauflösung" [level=2] [ref=f2e131]
    - paragraph [ref=f2e132]:
      - text: "Eine Entrümpelung schafft Platz in einem Zuhause, das bewohnt bleibt: Der Keller wird leer, die Garage wieder befahrbar, der Dachboden begehbar, und Sie entscheiden Stück für Stück, was bleibt. Eine Haushaltsauflösung beendet einen Haushalt: Wir räumen die Wohnung oder das Haus komplett zur Übergabe an Vermieter oder Käufer, oft im Erb- oder Pflegefall. Vorher sichern wir Dokumente, Erinnerungsstücke und Wertgegenstände. Preislich gilt bei beidem derselbe Rahmen: Festpreis für Räumung und Abtransport nach kostenloser Besichtigung, Entsorgung nach Beleg. Der Unterschied liegt im Umfang, in der Sorgfalt beim Sichten und in den Fristen, die bei einer Auflösung meist Vermieter oder Notar vorgeben."
      - link "Zur Haushaltsauflösung" [ref=f2e133] [cursor=pointer]:
        - /url: /haushaltsaufloesung/
      - text: .
