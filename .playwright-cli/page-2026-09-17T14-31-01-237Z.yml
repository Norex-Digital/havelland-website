  - generic [ref=f2e59]:
    - paragraph [ref=f2e60]:
      - strong [ref=f2e61]: "Eine Entrümpelung ist das Ausräumen und die fachgerechte Entsorgung von allem, was aus Keller, Garage, Dachboden, Schuppen, Wohnung oder Haus weg soll, mit besenreiner Übergabe am Ende. Anders als bei einer Haushaltsauflösung bleibt das Zuhause dabei bewohnt: Es geht um Platz, nicht um Abschied."
    - heading "Entrümpelung im Havelland — was dazugehört" [level=2] [ref=f2e62]
    - heading "Keller entrümpeln" [level=3] [ref=f2e63]
    - paragraph [ref=f2e64]: "Ein Keller im Havelland füllt sich über Jahrzehnte: Einweckgläser, Farbeimer, das Fahrrad ohne Reifen, Kartons vom letzten Umzug und die Waschmaschine, die niemand mehr angeschlossen hat. Wir tragen alles selbst nach oben, auch über die schmale Kellertreppe eines Siedlungshauses, und stellen nichts vor Ihre Tür. Was noch brauchbar ist, legen wir beiseite und rechnen es an. Den Rest trennen wir schon beim Tragen nach Holz, Metall, Elektro und Restabfall, damit der Wertstoffhof jede Ladung sauber annimmt. Alte Farben, Lacke und Chemikalien lassen wir stehen und sagen Ihnen, wo Sie sie als Privathaushalt kostenfrei abgeben können. Bei der kostenlosen Besichtigung sehen wir uns Menge, Treppe und den Weg zum Anhänger an. Danach steht Ihr Festpreis für Räumung und Abtransport schriftlich fest, die Entsorgungsgebühren des Wertstoffhofs weisen wir nach Beleg aus. Am Ende ist der Keller besenrein, und Sie haben die Fotos auf dem Handy."
    - heading "Garage entrümpeln" [level=3] [ref=f2e65]
    - paragraph [ref=f2e66]: Eine Garage ist selten nur eine Garage. In Falkensee, Dallgow-Döberitz oder Brieselang steht darin der Rasenmäher neben dem Regal mit Altreifen, dazu Bretter, Farbreste, zwei Kinderfahrräder und die Kisten, die seit dem Einzug niemand geöffnet hat. Wir räumen die Garage an einem Termin leer, sortieren Werkzeug und Brauchbares aus und fahren den Rest zum Wertstoffhof. Reifen, Metall und Altholz nimmt der Hof getrennt an, deshalb laden wir schon getrennt. Bei einer einzelnen Garage reicht oft ein Foto vom Inhalt per WhatsApp für eine erste, unverbindliche Einschätzung; den Festpreis für Räumung und Abtransport nennen wir nach der Besichtigung. Zum Schluss fegen wir durch, und Sie stellen abends das Auto wieder hinein. Autoteile mit Öl oder Kraftstoff, Batterien und Gasflaschen bleiben draußen, dafür nennen wir Ihnen die passende Annahmestelle.
    - heading "Dachboden entrümpeln" [level=3] [ref=f2e67]
    - paragraph [ref=f2e68]: "Der Dachboden ist der schwerste Teil einer Entrümpelung: enge Luke, steile Stiege, wenig Licht, dazu Weihnachtskisten, Koffer, Matratzen und die Möbel der Großeltern. Wir bringen alles über die Treppe nach unten, packen losen Staub und Kleinteile in Säcke und tragen Sperriges zu zweit. Alte Mineralwolle, Platten mit Asbestverdacht oder Teerpappe ohne Schadstoff-Nachweis fassen wir nicht an; dafür vermitteln wir einen Fachbetrieb. Die kommunale Sperrmüllabfuhr holt Möbel und Matratzen nur zweimal im Jahr und nach bis zu vier Wochen Wartezeit ab, wir nehmen alles direkt mit. Nach der kostenlosen Besichtigung bekommen Sie den Preis für Räumung und Abtransport schriftlich zugesagt, Entsorgungsgebühren weisen wir nach Beleg aus. Ist der Dachboden leer, kommt der Foto-Nachweis aufs Handy."
    - heading "Schuppen und Gartenhaus entrümpeln — oder gleich abreißen" [level=3] [ref=f2e69]
    - paragraph [ref=f2e70]:
      - text: "Gartenschuppen im Havelland stehen oft seit den Siedlungsjahren: Holz, Dachpappe, ein Betonsockel, innen Gartengeräte, Dünger, Farbe, Fahrräder und alles, was im Haus keinen Platz mehr hatte. Wir räumen den Schuppen aus, trennen Holz, Metall und Restabfall und fahren es zum Wertstoffhof. Steht der Schuppen selbst nicht mehr sicher, reißen wir ihn nach dem Ausräumen ab und entsorgen Holz, Dachpappe und Metall getrennt, weil der Wertstoffhof jede Abfallart einzeln wiegt und abrechnet. Auch ein Hühnerstall, ein alter Metallzaun oder der Holzhaufen hinter dem Schuppen kommen mit weg. Bleibt danach ein verwilderter Garten übrig, übernehmen wir die Gartenrodung gleich mit. Bei der kostenlosen Besichtigung sehen wir uns Zufahrt, Untergrund und Menge an. Danach steht der Preis aus der Besichtigung schriftlich fest, Entsorgungsgebühren weisen wir nach Beleg aus."
      - link "Mehr zur Gartenrodung" [ref=f2e71] [cursor=pointer]:
        - /url: /gartenrodung/
      - text: .
    - heading "Wohnung und Haus entrümpeln" [level=3] [ref=f2e72]
    - paragraph [ref=f2e73]:
      - text: "Bei Wohnung und Haus unterscheiden wir zwei Fälle. Die Teilräumung: ein Zimmer, das Gästezimmer voller Kartons, der Hobbyraum, die Einbauküche vor der Renovierung. Und die komplette Räumung: Möbel, Hausrat, Teppiche, Elektrogeräte und Kleinkram aus allen Räumen, besenrein für Vermieter, Käufer oder den nächsten Bewohner. Beides bekommen Sie zum schriftlichen Festpreis für Räumung und Abtransport nach kostenloser Besichtigung. Sie müssen nicht vor Ort sein: Schlüsselübergabe und eine kurze schriftliche Vollmacht reichen, die Fotos vom leeren Raum kommen aufs Handy. Was bleiben soll, markieren Sie vorher mit Zettel oder Klebeband, alles andere geht mit. Wir arbeiten ruhig und ohne Kommentar gegenüber Nachbarn. Wechselt das Haus nach einem Todesfall oder dem Umzug ins Pflegeheim den Besitzer und sollen vorher Dokumente und Wertsachen gesichert werden, ist das eine Haushaltsauflösung. Dafür haben wir eine eigene Seite."
      - link "Haushaltsauflösung im Erb- oder Pflegefall" [ref=f2e74] [cursor=pointer]:
        - /url: /haushaltsaufloesung/
      - text: .
    - heading "Sperrmüll, Wertstoffhof und Entsorgung nach Beleg" [level=3] [ref=f2e75]
    - paragraph [ref=f2e76]: Sie müssen keine Sperrmüllkarte ziehen und nichts an die Straße stellen. Die Sperrmüllabfuhr des Landkreises Havelland kommt für Privathaushalte zweimal im Jahr nach Anmeldung, mit bis zu vier Wochen Wartezeit. Bauabfälle, Fenster, Türen, Laminat und größere Mengen aus Haushaltsauflösungen nimmt sie nicht mit (Stand 09/2026). Wir fahren stattdessen direkt zum Wertstoffhof Falkensee an der Nauener Straße 97. Geöffnet ist er Montag 9 bis 18 Uhr, Dienstag bis Freitag 9 bis 17 Uhr und Samstag 8 bis 13 Uhr. Dort wird jede Ladung gewogen und nach der Abfallgebührensatzung des Landkreises abgerechnet, Altholz zum Beispiel mit 0,36 € je Kilogramm (Stand 2026). Beim letzten Auftrag in Falkensee, Abstellkammer und Gartenschuppen, standen auf den Belegen 458 € Entsorgungsgebühren (zwei Fahrten zum Wertstoffhof Falkensee). Grundsätzlich rechnen wir Entsorgungsgebühren nach Beleg ab, zuzüglich Mehrwertsteuer, ohne eigenen Aufschlag. Schadstoffe wie Farben, Chemikalien oder Asbest transportieren wir nicht; dafür nennen wir Ihnen die Annahmestelle oder einen Fachbetrieb.
    - heading "Wertanrechnung und was wir nicht anbieten" [level=3] [ref=f2e77]
    - paragraph [ref=f2e78]: "Gut erhaltene Möbel, funktionierende Elektrogeräte, Werkzeug oder Sammlerstücke prüfen wir bei der Besichtigung und ziehen sie von der vereinbarten Summe ab, statt sie zu entsorgen. Wir sagen Ihnen offen, was einen Wert hat und was nur Gewicht ist. Geruchsbehandlung, das Entfernen von oberflächlichem Schimmel und eine Grundreinigung nach der Räumung führen wir auf Wunsch aus. Sie stehen als eigene Positionen mit eigenem Preis im Angebot, damit Sie vorher wissen, was Sie zahlen. Drei Dinge bieten wir nicht an: Malern und Tapezieren, das Verlegen von Böden und die Sanierung von Schimmel in der Bausubstanz. Dafür vermitteln wir Ihnen einen Fachbetrieb und stimmen den Termin mit ab, wenn Sie das wollen. So bleibt unser Angebot bei dem, was wir mit eigenen Händen und eigenem Anhänger leisten."
    - heading "Entrümpelung in Ihrer Nähe" [level=3] [ref=f2e79]
    - paragraph [ref=f2e80]: "Wir sitzen in Falkensee. Von dort sind Dallgow-Döberitz, Brieselang, Schönwalde-Glien, Wustermark, Nauen und Berlin-Spandau kurze Wege, und der Wertstoffhof Falkensee liegt auf der Strecke. Für Sie heißt das: keine lange Anfahrt, die im Preis stecken müsste, und dieselbe Nummer vom ersten Foto bis zum Foto-Nachweis. Suchen Sie eine Entrümpelung in der Nähe, sind wir im östlichen Havelland meist schon in der Nachbarschaft unterwegs."
    - heading "So läuft es ab" [level=3] [ref=f2e81]
    - paragraph [ref=f2e82]: "Schritt eins: ein Foto per WhatsApp oder ein Anruf. Schritt zwei: Rückmeldung innerhalb von Stunden; bei einem einzelnen Keller oder einer Garage reicht das Foto oft für eine erste, unverbindliche Einschätzung. Schritt drei: kostenlose Besichtigung vor Ort, wir sehen uns Menge, Zugang und Abfallarten an. Schritt vier: Sie bekommen den schriftlichen Festpreis für Räumung und Abtransport, Entsorgungsgebühren weisen wir nach Beleg aus. Schritt fünf: Termin, wir räumen aus, sortieren Verwertbares, fahren zum Wertstoffhof und übergeben besenrein. Schritt sechs: die Vorher-Nachher-Fotos landen direkt nach der Übergabe auf Ihrem Handy."
    - heading "Unsere Garantie" [level=3] [ref=f2e83]
    - paragraph [ref=f2e84]: Der Festpreis für Räumung und Abtransport aus der Besichtigung bleibt, egal wie lange es am Ende dauert. Entsorgungsgebühren weisen wir nach Beleg aus.
